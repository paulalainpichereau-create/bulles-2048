<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffb15c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bulles 2048</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Luckiest+Guy&display=swap">
<style>
/* Layout: HUD row, level ladder, missions strip, glass jar canvas, tool bar; options sheet over everything. Single aquatic look. */
:root{
  --bg:#0e3b43; --bg2:#14535d; --glass:#7fd4d0; --fg:#effbf9; --muted:#9cc9c4; --danger:#ff6b6b; --cta:#ffcc4d; --ok:#8fe388;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));background-color:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{height:100%;display:flex;flex-direction:column;gap:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.next{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:14px;padding:2px 8px;color:var(--fg);font-family:var(--display);cursor:default}
.next.ready{border-color:var(--cta);cursor:pointer;background:rgba(255,204,77,.08)}
.next.ready .lbl{color:var(--cta)}
.next:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
#nextc{width:40px;height:40px}
.right{text-align:right}
.ladder{display:flex;gap:4px;justify-content:center}
.ladder span{flex:1;max-width:34px;height:20px;border-radius:6px;font-size:10px;font-weight:700;display:grid;place-items:center;background:rgba(239,251,249,.08);color:var(--muted);font-variant-numeric:tabular-nums;transition:transform .2s}
.ladder span.on{color:#16323a}
.ladder span.new{transform:scale(1.35)}
.missions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.missions span{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(239,251,249,.08);color:var(--muted);border:1px solid rgba(239,251,249,.14)}
.missions span.done{background:var(--ok);color:#16323a;border-color:var(--ok)}
.missions span.fail{text-decoration:line-through;opacity:.5}
#stage{flex:1;min-height:0;position:relative}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.group{display:flex;gap:8px}
.tool{font-family:var(--display);font-size:15px;font-weight:600;color:var(--fg);background:rgba(239,251,249,.1);border:2px solid rgba(239,251,249,.2);border-radius:999px;padding:8px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tool:disabled{opacity:.4;cursor:default}
.tool.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.tool:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
.help{font-size:12px;color:var(--muted);text-align:center;flex:1;min-width:0}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 78%,transparent)}
.card{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:320px}
h2{margin:0;font-size:34px;color:var(--danger)}
.big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums}
.small{color:var(--muted);font-size:15px}
.stats{display:flex;gap:18px;justify-content:center}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.cta{font-family:var(--display);font-weight:700;font-size:20px;color:var(--bg);background:var(--cta);border:0;border-radius:999px;padding:12px 32px;cursor:pointer;box-shadow:0 5px 0 #c9971a}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #c9971a}
.cta:focus-visible{outline:3px solid var(--glass);outline-offset:4px}
/* options sheet */
#menu{position:fixed;inset:0;z-index:20;overflow-y:auto;background:color-mix(in srgb,var(--bg) 92%,transparent);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
.sheet{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-size:26px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.opt{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(239,251,249,.06);border:1px solid rgba(239,251,249,.12);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;width:44px;height:26px;border-radius:999px;background:rgba(239,251,249,.18);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.opt input:checked+.sw{background:var(--ok)}
.opt input:checked+.sw::after{transform:translateX(18px)}
.opt input:focus-visible+.sw{outline:3px solid var(--glass);outline-offset:2px}
.opt .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt b{font-size:16px}
.opt small{font-size:13px;color:var(--muted);line-height:1.35}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}
.ghost{font-family:var(--display);font-size:16px;font-weight:600;color:var(--fg);background:none;border:2px solid rgba(239,251,249,.3);border-radius:999px;padding:10px 22px;cursor:pointer}
.ghost:focus-visible{outline:3px solid var(--glass);outline-offset:2px}

/* theme "Bonbons": sunny polka dots, sticker panels, cartoon numerals */
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:var(--display);font-size:16px;font-weight:600;padding:10px;border-radius:14px;cursor:pointer;background:rgba(239,251,249,.06);color:var(--fg);border:2px solid rgba(239,251,249,.2)}
.seg button.on{border-color:var(--cta);background:color-mix(in srgb,var(--cta) 22%,transparent)}
.seg button:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
body.fun{--bg:#ff8a5c;--bg2:#ffd45e;--fg:#3a1d4d;--muted:#7a4466;--glass:#ffffff;--danger:#e8304f;--cta:#ff3f8e;--ok:#43c35e;--num:"Luckiest Guy","Arial Black",Impact,sans-serif;color-scheme:light;
  background:radial-gradient(circle at 14px 14px,rgba(255,255,255,.28) 4px,transparent 5px) 0 0/30px 30px,linear-gradient(180deg,var(--bg2),var(--bg));background-color:var(--bg)}
body.fun .val{font-family:var(--num);font-size:28px;letter-spacing:.03em;line-height:1.2}
body.fun .hud>div{background:#fff;border:3px solid var(--fg);border-radius:16px;padding:4px 12px 2px;box-shadow:0 4px 0 var(--fg)}
body.fun .hud>div:first-child{transform:rotate(-2deg)}
body.fun .hud>div.right{transform:rotate(2deg)}
body.fun .next{background:#fff;border:3px solid var(--fg);box-shadow:0 4px 0 var(--fg)}
body.fun .next.ready{border-color:var(--cta);background:#fff0f6;animation:wig 1.6s ease-in-out infinite}
body.fun .next.ready .lbl{color:var(--cta)}
@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) scale(1.04)}}
@media (prefers-reduced-motion:reduce){body.fun .next.ready{animation:none}}
body.fun .ladder span{background:rgba(255,255,255,.55);color:var(--fg);border:2px solid rgba(58,29,77,.25);font-family:var(--num);font-weight:400;font-size:11px;padding-top:2px}
body.fun .ladder span.on{border-color:var(--fg);color:var(--fg)}
body.fun .missions span{background:rgba(255,255,255,.8);color:var(--fg);border:2px solid var(--fg)}
body.fun .missions span.done{background:var(--ok);color:#fff;border-color:var(--fg)}
body.fun .tool{background:#fff;color:var(--fg);border:3px solid var(--fg);box-shadow:0 3px 0 var(--fg)}
body.fun .tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--fg)}
body.fun .tool.armed{background:var(--danger);color:#fff}
body.fun .card{background:#fff;border:3px solid var(--fg);border-radius:26px;padding:22px 20px;box-shadow:0 6px 0 var(--fg);transform:rotate(-1deg)}
body.fun h2,body.fun .big,body.fun .sheet h3{font-family:var(--num);font-weight:400;letter-spacing:.03em}
body.fun .cta{font-family:var(--num);font-weight:400;color:#fff;background:var(--cta);border:3px solid var(--fg);box-shadow:0 5px 0 var(--fg);letter-spacing:.04em}
body.fun .cta:active{box-shadow:0 2px 0 var(--fg)}
body.fun .opt{background:#fff;border:3px solid var(--fg)}
body.fun .sw{background:rgba(58,29,77,.2)}
body.fun .sw::after{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
body.fun .ghost{border-color:var(--fg);background:#fff}
body.fun .seg button{background:#fff;border:3px solid var(--fg)}
body.fun .seg button.on{background:var(--cta);color:#fff}
body.fun #menu{background:color-mix(in srgb,var(--bg2) 94%,transparent)}
</style>
</head>
<body>


<div id="wrap">
  <div class="hud">
    <div><div class="lbl">Score</div><div class="val" id="score">0</div></div>
    <button class="next" id="nextBtn" aria-label="Bulle suivante"><span class="lbl" id="nextLbl">Suivante</span><canvas id="nextc" width="80" height="80"></canvas></button>
    <div class="right"><div class="lbl">Record</div><div class="val" id="best">0</div></div>
  </div>
  <div class="ladder" id="ladder"></div>
  <div class="missions" id="missions" hidden></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2 id="title">Ça déborde !</h2>
        <div class="big" id="final">0</div>
        <div class="stats">
          <div><b id="sBig">2</b><span class="small">plus grosse bulle</span></div>
          <div><b id="sChain">×1</b><span class="small">meilleure chaîne</span></div>
          <div><b id="sMis">0</b><span class="small">missions</span></div>
        </div>
        <div class="small" id="msg"></div>
        <button class="cta" id="again">Rejouer</button>
      </div>
    </div>
  </div>
  <div class="tools">
    <div class="group">
      <button class="tool" id="needle" disabled aria-label="Aiguille">📍 <span id="nCount">0</span></button>
      <button class="tool" id="shake" disabled aria-label="Secouer le bocal">〰️ <span id="sCount">0</span></button>
    </div>
    <div class="help" id="help"></div>
    <div class="group">
      <button class="tool" id="opts" aria-label="Options">⚙️</button>
      <button class="tool" id="sound" aria-label="Son">🔊</button>
    </div>
  </div>
</div>

<div id="menu" hidden>
  <div class="sheet">
    <h3>Options de jeu</h3>
    <div class="seg" id="themeSeg"><button data-th="fun">🍬 Bonbons</button><button data-th="aqua">🫧 Aquarium</button></div>
    <p>Active ou coupe chaque nouveauté pour voir ce qui te plaît. Les changements s'appliquent à la nouvelle partie.</p>
    <label class="opt"><input type="checkbox" id="o-joker"><span class="sw"></span><span class="tx"><b>🌈 Bulle joker</b><small>Bulle arc-en-ciel rare qui fusionne avec la première bulle qu'elle touche, quel que soit son nombre.</small></span></label>
    <label class="opt"><input type="checkbox" id="o-swap"><span class="sw"></span><span class="tx"><b>⇄ Échange</b><small>Touche la bulle « Suivante » pour l'échanger avec celle en main. Rechargé toutes les 5 bulles.</small></span></label>
    <label class="opt"><input type="checkbox" id="o-cascade"><span class="sw"></span><span class="tx"><b>⚡ Cascade</b><small>Une bulle fraîchement fusionnée attire sa jumelle proche. Bonus de 50 % sur la fusion en cascade.</small></span></label>
    <label class="opt"><input type="checkbox" id="o-fragile"><span class="sw"></span><span class="tx"><b>🪨 Bulle fragile</b><small>Une bulle grise tombe parfois. Elle ne fusionne pas mais casse après 3 fusions à côté d'elle.</small></span></label>
    <label class="opt"><input type="checkbox" id="o-missions"><span class="sw"></span><span class="tx"><b>🎯 Missions</b><small>Trois petits défis par partie, +300 points chacun.</small></span></label>
    <label class="opt"><input type="checkbox" id="o-zen"><span class="sw"></span><span class="tx"><b>🌊 Mode Zen</b><small>Impossible de perdre. Quand le bocal déborde, la plus petite bulle s'éclate toute seule.</small></span></label>
    <div class="row">
      <button class="cta" id="apply">Nouvelle partie</button>
      <button class="ghost" id="closeMenu">Reprendre</button>
    </div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const nc=document.getElementById('nextc'),nctx=nc.getContext('2d');
const $=id=>document.getElementById(id);
const VALUES=[2,4,8,16,32,64,128,256,512,1024,2048];
const PAL={aqua:['#ff8fa3','#ffb347','#ffe066','#9be15d','#4cd4b0','#4fb3ff','#7c8cff','#b48cff','#ff7ad9','#ff5e5e','#ffd700'],
 fun:['#ff7eb3','#ff9a3c','#ffd23f','#8be04e','#2fd3b5','#45a8ff','#7d6bff','#c46bff','#ff5fd0','#ff4757','#ffc400']};
let COLORS=PAL.aqua,FUN=false;
const INK='#3a1d4d';
const FRAGILE='#8fa3a8';
const SPR={};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- options ----------
const OPT_KEYS=['joker','swap','cascade','fragile','missions','zen'];
let OPT={joker:true,swap:true,cascade:true,fragile:true,missions:true,zen:false};
try{Object.assign(OPT,JSON.parse(store.get('bulles-opts','{}')))}catch(e){}
let A={...OPT}; // options active in the current game
OPT_KEYS.forEach(k=>{const el=$('o-'+k);el.checked=!!OPT[k];el.onchange=()=>{OPT[k]=el.checked;store.set('bulles-opts',JSON.stringify(OPT))}});
let paused=false;
function openMenu(){paused=true;$('menu').hidden=false;$('apply').focus()}
function closeMenu(){paused=false;$('menu').hidden=true}
$('opts').onclick=()=>{au();openMenu()};
$('closeMenu').onclick=closeMenu;
$('apply').onclick=()=>{closeMenu();start()};

// ---------- theme ----------
let THEME='fun';
function applyTheme(th){
  THEME=th;FUN=th==='fun';COLORS=PAL[th];document.body.classList.toggle('fun',FUN);
  for(const k in SPR)delete SPR[k];
  [...document.querySelectorAll('#themeSeg button')].forEach(b=>b.classList.toggle('on',b.dataset.th===th));
  if(typeof maxL==='number'){updLadder(maxL);drawNext()}
}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.th);store.set('bulles-theme',b.dataset.th)});
// ---------- ladder ----------
const lad=$('ladder');VALUES.forEach((v,i)=>{const s=document.createElement('span');s.textContent=v>=1024?(v/1024)+'k':v;lad.appendChild(s)});
function updLadder(maxL,fresh){[...lad.children].forEach((s,i)=>{const on=i<=maxL;s.classList.toggle('on',on);s.style.background=on?COLORS[i]:'';s.classList.toggle('new',i===fresh)});if(fresh!=null)setTimeout(()=>lad.children[fresh]&&lad.children[fresh].classList.remove('new'),300)}

// ---------- sound ----------
let AC=null,muted=store.get('bulles-mute','0')==='1';
$('sound').textContent=muted?'🔇':'🔊';
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='sine',vol=.18,slide=0,delay=0){if(muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
const sDrop=()=>tone(220,.12,'sine',.12,.6);
const sMerge=(l,c)=>{const f=330*Math.pow(1.122,l+Math.min(c,6));tone(f,.18,'triangle',.16,1.5);tone(f*1.5,.12,'sine',.08)};
const sPop=()=>tone(900,.1,'square',.06,.3);
const sLose=()=>tone(300,.4,'sawtooth',.1,.4);
const sWin=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.12,1,i*.09))};
const sSwap=()=>{tone(440,.08,'sine',.1);tone(660,.08,'sine',.1,1,.06)};
const sCrack=()=>tone(160,.15,'square',.08,.5);
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';store.set('bulles-mute',muted?'1':'0')};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---------- jar ----------
let W,H,dpr,J,balls=null;
function rad(l){return J.w*(0.05+0.026*l-0.0011*l*l)}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const jw=Math.min(W,H*0.72,440);const jh=Math.min(H-60,jw*1.5);
  const old=J;J={x:(W-jw)/2,y:H-jh-6,w:jw,h:jh};
  if(old&&balls)balls.forEach(b=>{const k=J.w/old.w;b.x=J.x+(b.x-old.x)*k;b.y=J.y+J.h-(old.y+old.h-b.y)*k;b.px=b.x;b.py=b.y;b.r=rad(b.l)});
}
addEventListener('resize',resize);resize();

// ---------- state ----------
let best=+store.get('bulles-best',0)||0;
$('best').textContent=best;
let score,cur,next,aimX,cool,over,overT,pops,parts,floats,won,chain,chainT,bestChain,maxL,needles,nextNeedle,armed,shakes=0,shakeT=0,grace=0,swapIn=0,zenT=0,st,missions=[];
function rndL(){const cap=Math.min(3,1+Math.floor(maxL/2));const r=Math.random();const l=r<.38?0:r<.7?1:r<.9?2:3;return Math.min(l,cap)}
function newItem(){
  const r=Math.random();
  if(A.joker&&maxL>=3&&r<.05)return{l:1,k:'joker'};
  if(A.fragile&&maxL>=4&&r>.94)return{l:2,k:'fragile'};
  return{l:rndL()};
}
const MISSIONS=[
  {id:'chain3',label:'Chaîne ×3',ok:()=>bestChain>=3},
  {id:'chain4',label:'Chaîne ×4',ok:()=>bestChain>=4},
  {id:'two128',label:'Crée deux 128',ok:()=>st.made[6]>=2},
  {id:'r256',label:'Atteins 256',ok:()=>maxL>=7},
  {id:'f25',label:'25 fusions',ok:()=>st.merges>=25},
  {id:'noneedle',label:'1000 pts sans aiguille',ok:()=>score>=1000&&!st.needle,fail:()=>st.needle},
  {id:'noshake',label:'128 sans secouer',ok:()=>maxL>=6&&!st.shake,fail:()=>st.shake},
  {id:'casc',label:'2 cascades',ok:()=>st.casc>=2,need:'cascade'},
  {id:'jok',label:'Utilise un joker',ok:()=>st.joker>=1,need:'joker'},
  {id:'crack',label:'Casse une fragile',ok:()=>st.crack>=1,need:'fragile'},
];
function pickMissions(){
  const pool=MISSIONS.filter(m=>!m.need||A[m.need]).sort(()=>Math.random()-.5);
  missions=pool.slice(0,3).map(m=>({...m,state:''}));
  renderMissions();
}
function renderMissions(){
  const el=$('missions');el.hidden=!A.missions;if(!A.missions)return;
  el.innerHTML='';missions.forEach(m=>{const s=document.createElement('span');s.textContent=(m.state==='done'?'✓ ':'')+m.label;if(m.state)s.className=m.state;el.appendChild(s)});
}
function checkMissions(){
  if(!A.missions||over)return;let ch=false;
  missions.forEach(m=>{if(m.state)return;
    if(m.fail&&m.fail()){m.state='fail';ch=true}
    else if(m.ok()){m.state='done';ch=true;score+=300;$('score').textContent=score;floats.push({x:J.x+J.w/2,y:J.y+J.h*.35,t:0,txt:'Mission ✓ +300',col:'#8fe388'});sWin();buzz(30)}
  });
  if(ch)renderMissions();
}

function reset(){
  A={...OPT};
  balls=[];pops=[];parts=[];floats=[];score=0;maxL=2;aimX=J.x+J.w/2;cool=0;over=false;overT=0;won=false;zenT=0;
  chain=0;chainT=0;bestChain=1;needles=1;nextNeedle=1500;armed=false;shakes=1;shakeT=0;grace=0;swapIn=0;
  st={merges:0,made:Array(11).fill(0),needle:false,shake:false,casc:0,joker:0,crack:0};
  cur=newItem();next=newItem();
  $('score').textContent=0;drawNext();updLadder(maxL);updNeedle();updShake();pickMissions();

    acc+=dt;while(acc>1/120){step(1/120);acc-=1/120}
    cool=Math.max(0,cool-dt);chainT=Math.max(0,chainT-dt);
    const danger=balls.some(b=>b.age>1.2&&!b.falling&&b.y-b.r<lineY());
    grace=Math.max(0,grace-dt);
    if(A.zen){
      zenT=danger&&grace===0?zenT+dt:0;
      if(zenT>1.2){
        const v=balls.filter(b=>!b.falling&&b.grow>=1);
        v.sort((p,q)=>(p.k==='fragile'?-1:p.l)-(q.k==='fragile'?-1:q.l)||q.y-p.y);
        if(v[0]){kill(v[0],colorOf(v[0]));balls=balls.filter(b=>!b.dead);sPop()}
        zenT=0;grace=0.5;
      }
    }else{
      overT=danger&&grace===0?overT+dt:Math.max(0,overT-dt*2);
      if(overT>3.5)end(false);
    }
  }else acc=0;
  pops.forEach(p=>p.t+=dt);pops=pops.filter(p=>p.t<.4);
  parts.forEach(q=>{q.rot+=q.vr*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.life-=dt});parts=parts.filter(q=>q.life>0);
  floats.forEach(f=>{f.t+=dt;f.y-=40*dt});floats=floats.filter(f=>f.t<1.1);
  balls.forEach(b=>{if(b.pop)b.pop=Math.max(0,b.pop-dt*4);if(b.hit)b.hit=Math.max(0,b.hit-dt*3);if(b.sq)b.sq=Math.max(0,b.sq-dt*4)});
  draw(now/1000);requestAnimationFrame(loop);
}
function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(shakeT>0&&!reduce)ctx.translate(Math.sin(t*90)*5*(shakeT/0.9),Math.cos(t*70)*2*(shakeT/0.9));
  if(FUN){
    // candy jar: frosted glass, thick ink outline, rounded base, lip at the top
    const rr=Math.min(34,J.w*.09);
    ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.moveTo(J.x,J.y);ctx.lineTo(J.x,J.y+J.h-rr);ctx.quadraticCurveTo(J.x,J.y+J.h,J.x+rr,J.y+J.h);ctx.lineTo(J.x+J.w-rr,J.y+J.h);ctx.quadraticCurveTo(J.x+J.w,J.y+J.h,J.x+J.w,J.y+J.h-rr);ctx.lineTo(J.x+J.w,J.y);ctx.fill();
    if(!reduce){for(let i=0;i<10;i++){const x=J.x+12+((i*67.3)%(J.w-24)),y=J.y+J.h-((t*24+i*71)%J.h);ctx.fillStyle=PAL.fun[i%11];ctx.globalAlpha=.35;ctx.save();ctx.translate(x,y);ctx.rotate(i+t);ctx.fillRect(-5,-1.5,10,3);ctx.restore()}ctx.globalAlpha=1}
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(J.x+12,J.y+J.h*.18);ctx.lineTo(J.x+12,J.y+J.h*.55);ctx.stroke();
    ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(J.x-2,J.y-6);ctx.lineTo(J.x-2,J.y+J.h-rr);ctx.quadraticCurveTo(J.x-2,J.y+J.h+2,J.x+rr,J.y+J.h+2);ctx.lineTo(J.x+J.w-rr,J.y+J.h+2);ctx.quadraticCurveTo(J.x+J.w+2,J.y+J.h+2,J.x+J.w+2,J.y+J.h-rr);ctx.lineTo(J.x+J.w+2,J.y-6);ctx.stroke();
    ctx.fillStyle='#fff';[J.x-2,J.x+J.w+2].forEach(px=>{ctx.beginPath();ctx.roundRect(px-8,J.y-12,16,10,4);ctx.fill();ctx.lineWidth=3;ctx.stroke()});
  }else{
  if(!reduce){ctx.fillStyle='rgba(239,251,249,.06)';for(let i=0;i<14;i++){const x=J.x+((i*73.1)%J.w),y=J.y+J.h-((t*30+i*61)%J.h);ctx.beginPath();ctx.arc(x+Math.sin(t+i)*4,y,2+i%3,0,6.283);ctx.fill()}}
  ctx.fillStyle='rgba(127,212,208,.08)';ctx.fillRect(J.x,J.y,J.w,J.h);
  ctx.strokeStyle='rgba(127,212,208,.6)';ctx.lineWidth=4;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(J.x-2,J.y-10);ctx.lineTo(J.x-2,J.y+J.h+2);ctx.lineTo(J.x+J.w+2,J.y+J.h+2);ctx.lineTo(J.x+J.w+2,J.y-10);ctx.stroke();
  }
  const ly=lineY();
  ctx.setLineDash([8,8]);ctx.lineWidth=2;
  if(A.zen)ctx.strokeStyle='rgba(127,212,208,.35)';
  else ctx.strokeStyle=overT>0?`rgba(${FUN?'232,48,79':'255,107,107'},${.4+.6*Math.abs(Math.sin(t*8))})`:FUN?'rgba(58,29,77,.35)':'rgba(239,251,249,.25)';
  ctx.beginPath();ctx.moveTo(J.x,ly);ctx.lineTo(J.x+J.w,ly);ctx.stroke();ctx.setLineDash([]);
  if(A.zen){ctx.fillStyle=FUN?'rgba(58,29,77,.6)':'rgba(127,212,208,.6)';ctx.font='600 12px Fredoka, Trebuchet MS, sans-serif';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('ZEN',J.x+J.w-4,ly-4)}
  else if(overT>0&&!over){ctx.fillStyle='#ff6b6b';ctx.fillRect(J.x,ly-6,J.w*(overT/3.5),4)}
  if(!over&&!armed){
    const r=rad(cur.l),x=Math.max(J.x+r,Math.min(J.x+J.w-r,aimX)),ly2=landingY(x,r);
    ctx.strokeStyle=FUN?'rgba(58,29,77,.22)':'rgba(239,251,249,.16)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,J.y);ctx.lineTo(x,ly2-r);ctx.stroke();
    ctx.globalAlpha=cool>0?.45:1;drawBall({l:cur.l,k:cur.k,hp:3,blink:0},x,J.y-r-6,r,t);ctx.globalAlpha=1;
  }
  for(const b of balls){
    if(b.seek&&!b.seek.dead){ctx.strokeStyle=`rgba(127,212,208,${.4+.4*Math.sin(t*20)})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.seek.x,b.seek.y);ctx.stroke()}
  }
  balls.forEach(b=>{
    const s=reduce?1:1+(b.pop||0)*.15;
    if(armed){ctx.strokeStyle='rgba(255,107,107,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,6.283);ctx.stroke()}
    drawBall(b,b.x,b.y,b.r*s,t);
  });
  pops.forEach(p=>{ctx.strokeStyle=p.col;ctx.globalAlpha=1-p.t/.4;ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+p.t*2),0,6.283);ctx.stroke()});
  parts.forEach(q=>{ctx.globalAlpha=Math.max(0,q.life/.7);ctx.fillStyle=q.col;if(FUN){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillRect(-q.sz,-q.sz*.45,q.sz*2,q.sz*.9);ctx.restore()}else{ctx.beginPath();ctx.arc(q.x,q.y,q.sz,0,6.283);ctx.fill()}});
  ctx.globalAlpha=1;
  floats.forEach(f=>{ctx.globalAlpha=Math.max(0,1-f.t);ctx.fillStyle=f.col;ctx.font=FUN?'22px "Luckiest Guy", Arial Black, sans-serif':'700 20px Fredoka, Trebuchet MS, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=FUN?6:4;ctx.lineJoin='round';ctx.strokeStyle=FUN?INK:'rgba(14,59,67,.8)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillText(f.txt,f.x,f.y)});
  ctx.globalAlpha=1;
}
applyTheme(store.get('bulles-theme','fun'));
reset();
try{document.fonts.load('40px "Luckiest Guy"').then(()=>{for(const k in SPR)delete SPR[k];drawNext()})}catch(e){}
if(store.get('bulles-seen-opts','0')!=='1'){store.set('bulles-seen-opts','1');openMenu()}
requestAnimationFrame(loop);
})();
</script>
